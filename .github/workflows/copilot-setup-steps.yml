name: "Etapas de configuração do Copilot"

# Pré-instala a cadeia de ferramentas da imersão no ambiente do agente do Copilot na nuvem
# para que as solicitações delegadas no Estágio 4 (consulte .github/agents/evolution.agent.md)
# comecem com Java 21, Node 20 + pnpm e Terraform já disponíveis.
#
# Contrato (docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent):
#   - o arquivo DEVE se chamar copilot-setup-steps.yml
#   - a tarefa (`job`) DEVE se chamar copilot-setup-steps
#   - somente steps, permissions, runs-on, services, snapshot e timeout-minutes são reconhecidos
#   - só entra em vigor após ser mesclado à ramificação padrão
#
# backend/ e frontend/ não existem até que a equipe os crie no Estágio 3, portanto essas
# etapas de dependências têm proteção e o fluxo de trabalho permanece verde antes de o protótipo existir.
# infra/ pode ser criado pela equipe nos Estágios 3/4; essa etapa também é protegida.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Etapas de configuração do Copilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # `cache: maven` faz setup-java falhar com "No file ... matched to [**/pom.xml]" quando
      # backend/ não existe, que é o estado normal até o Estágio 3. Determinar o modo pela árvore
      # mantém a execução verde antes de o protótipo existir e ainda restaura o armazenamento
      # temporário (cache) do Maven
      # assim que a equipe versiona backend/pom.xml.
      - name: Determinar o modo de armazenamento temporário do Maven
        id: maven-cache
        run: |
          set -euo pipefail
          if [ -f backend/pom.xml ]; then
            echo "mode=maven" >> "$GITHUB_OUTPUT"
          else
            echo "mode=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ steps.maven-cache.outputs.mode }}

      - name: Instalar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Configurar Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # Versão adotada pelo kit para módulos Terraform criados no Estágio 4.
          terraform_version: "1.14.6"

      - name: Preparar dependências do servidor
        run: |
          set -euo pipefail
          if [ -f backend/pom.xml ]; then
            cd backend && ./mvnw -B -q dependency:go-offline
          else
            echo "backend/ ainda não foi criado (Estágio 3) — ignorando."
          fi

      - name: Preparar dependências da interface web
        run: |
          set -euo pipefail
          if [ -f frontend/pnpm-lock.yaml ]; then
            cd frontend && pnpm install --frozen-lockfile
          elif [ -f frontend/package.json ]; then
            cd frontend && pnpm install
          else
            echo "frontend/ ainda não foi criado (Estágio 3) — ignorando."
          fi

      - name: Preparar provedores do Terraform
        run: |
          set -euo pipefail
          if [ ! -d infra ]; then
            echo "infra/ ainda não foi criado (Estágio 3/4) — ignorando."
            exit 0
          fi
          modules=$(find infra -type f -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          if [ -z "$modules" ]; then
            echo "infra/ ainda não contém módulos Terraform — ignorando."
            exit 0
          fi
          echo "$modules" | while read -r module; do
            terraform -chdir="$module" init -backend=false -input=false
          done
