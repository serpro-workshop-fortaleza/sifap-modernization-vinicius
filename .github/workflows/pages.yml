name: Trilingual documentation portal

on:
  workflow_dispatch:
  push:
    branches: [main, portugues-br, espanol]
  pull_request:
    branches: [main, develop, portugues-br, espanol]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      site_url: ${{ steps.pages.outputs.site_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all language refs fetched with full history
        shell: bash
        run: |
          set -euo pipefail
          for branch in main espanol portugues-br; do
            git rev-parse --verify "origin/${branch}^{commit}" ||
              { echo "::error::Publish the complete ${branch} edition before releasing the portal."; exit 1; }
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify repository and Pages access
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/scripts/pages-guard.mjs
      - name: Install locked dependencies
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm ci
      - name: Test ingestion, language coverage and publication guards
        working-directory: site
        run: npm test
      - name: Build all three editions and audit every generated route
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.site_url }}
          ASTRO_TELEMETRY_DISABLED: "1"
          CONTENT_REF_EN: ${{ (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop') || github.ref_name == 'main' || github.ref_name == 'develop') && 'HEAD' || 'origin/main' }}
          CONTENT_REF_ES: ${{ (github.base_ref == 'espanol' || github.ref_name == 'espanol') && 'HEAD' || 'origin/espanol' }}
          CONTENT_REF_PT_BR: ${{ (github.base_ref == 'portugues-br' || github.ref_name == 'portugues-br') && 'HEAD' || 'origin/portugues-br' }}
        run: npm run build
      - name: Install Chromium for browser validation
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Verify responsive reading and language interactions
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.site_url }}
          CI: "true"
        run: npm run test:browser
      - name: Verify access immediately before creating the deployment artifact
        if: github.event_name != 'pull_request' && contains(fromJSON('["main","portugues-br","espanol"]'), github.ref_name)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SITE_URL: ${{ steps.pages.outputs.site_url }}
        run: node site/scripts/pages-guard.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && contains(fromJSON('["main","portugues-br","espanol"]'), github.ref_name)
        with:
          path: site/dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && contains(fromJSON('["main","portugues-br","espanol"]'), github.ref_name)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
      - name: Fail closed if private access changed
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SITE_URL: ${{ needs.build.outputs.site_url }}
        run: node site/scripts/pages-guard.mjs
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
