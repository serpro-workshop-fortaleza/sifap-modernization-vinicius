name: 📋 Solicitação de especificação
description: Proponha uma nova especificação de funcionalidade (Estágio 2 — Especificação)
title: "[SPEC] "
labels: [ "spec", "stage-2" ]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use este modelo ao iniciar uma nova especificação em `specs/<NNN>-<feature>/`.
        > Normalmente, o Especialista em Requisitos ou o Responsável pelo Produto abre esta solicitação.

  - type: input
    id: feature-id
    attributes:
      label: ID da funcionalidade
      description: Número de três dígitos — deve corresponder ao nome da pasta em `specs/`
      placeholder: "003"
    validations:
      required: true

  - type: input
    id: feature-name
    attributes:
      label: "Nome da funcionalidade (formato kebab-case: minúsculas separadas por hífens)"
      placeholder: "<nome-da-funcionalidade>"
    validations:
      required: true

  - type: textarea
    id: business-goal
    attributes:
      label: Objetivo de negócio
      description: Qual resultado esta funcionalidade viabiliza? Relacione-o a uma regra de negócio do SIFAP
        quando possível.
      placeholder: "<descreva o resultado identificado pela equipe>"
    validations:
      required: true

  - type: textarea
    id: ears-requirements
    attributes:
      label: Requisitos EARS iniciais (rascunho)
      description: Use os 6 padrões EARS. O Especialista em Requisitos fará o refinamento.
      value: |
        - REQ-XXX-001 (Ubíquo): O sistema deve ...
        - REQ-XXX-002 (Orientado a evento): Quando ..., o sistema deve ...
        - REQ-XXX-003 (Orientado a estado): Enquanto ..., o sistema deve ...
    validations:
      required: true

  - type: textarea
    id: source-legacy
    attributes:
      label: Rastreabilidade com o legado (source_legacy)
      description: Todo REQ-ID deve citar um arquivo Natural .NSN, um arquivo Adabas .ddm ou uma nova implementação justificada com o token [GREENFIELD].
      value: |
        source_legacy: 01-archaeology/legacy-sifap/natural-programs/<FILE>.NSN#L<start>-L<end>
        # ou, para nova implementação: source_legacy: "[GREENFIELD] <justificativa em uma linha>"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critérios de aceitação
      description: Como será verificado que a especificação está completa?
      placeholder: |
        - [ ] Todos os requisitos usam um padrão EARS válido
        - [ ] Cada requisito é testável
        - [ ] O Responsável pelo Produto aprovou o escopo
    validations:
      required: true

  - type: dropdown
    id: lead-persona
    attributes:
      label: Persona líder
      options:
        - Especialista em Requisitos
        - Responsável pelo Produto
        - Arquiteto de Software
        - Arquiteto Corporativo
    validations:
      required: true
