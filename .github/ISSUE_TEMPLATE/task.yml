name: ✅ Tarefa de implementação
description: Uma única tarefa de implementação com escopo definido, derivada de uma especificação
title: "[T-NNN] "
labels: [ "task", "stage-3" ]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use este modelo para uma tarefa de implementação por vez.
        > As tarefas vêm de `specs/<NNN>-<feature>/tasks.md`.

  - type: input
    id: task-id
    attributes:
      label: ID da tarefa
      placeholder: "T-007"
    validations:
      required: true

  - type: input
    id: feature-folder
    attributes:
      label: Pasta da funcionalidade
      placeholder: "specs/<NNN>-<feature>/"
    validations:
      required: true

  - type: input
    id: req-ids
    attributes:
      label: REQ-IDs implementados
      description: Lista separada por vírgulas de todos os IDs de requisitos atendidos por esta tarefa.
      placeholder: "REQ-XXX, REQ-YYY"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critérios de aceitação (da especificação)
      description: Copie de `spec.md` para que a pessoa responsável pela implementação não precise
        alternar entre arquivos.
      placeholder: |
        - Quando <evento>, o sistema deve <comportamento verificável>.
        - Se <condição>, o sistema NÃO deve <comportamento proibido>.
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimativa de complexidade
      options:
        - XS (<1h)
        - S (1-2h)
        - M (2-4h)
        - L (4-8h)
        - XL (>1 dia)
    validations:
      required: true

  - type: dropdown
    id: lead-persona
    attributes:
      label: Persona líder
      options:
        - Desenvolvedor
        - DBA
        - Engenheiro de QA
        - Engenheiro de DevOps
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Depende de
      placeholder: |
        - T-XXX (tarefa pré-requisito)
        - ADR-XXXX (decisão relevante)

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definição de pronto
      value: |
        - [ ] Pelo menos um teste por critério de aceitação (vermelho → verde → refatorar)
        - [ ] Todos os métodos públicos que atendem a um `REQ-ID` têm Javadoc com `@implements REQ-NNN`
        - [ ] A CI está verde (compilação, análise estática, verificação de tipos, testes e cobertura)
        - [ ] A caixa correspondente em `tasks.md` está marcada
        - [ ] O título da solicitação de alteração (PR) usa o padrão Conventional Commits e vincula esta solicitação
        - [ ] Pelo menos uma revisão do par de personas na solicitação de alteração
    validations:
      required: true
