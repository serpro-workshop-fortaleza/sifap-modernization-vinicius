name: 🧱 Registro de Decisão de Arquitetura (ADR)
description: Documente uma decisão significativa de arquitetura ou projeto
title: "[ADR] "
labels: [ "adr", "stage-2", "architecture" ]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > Use este modelo quando houver uma decisão não trivial (>1 hora para reavaliar depois).
        > Exemplos: escolha entre monólito e microsserviços, estratégia de persistência, modelo de autenticação.

  - type: input
    id: adr-number
    attributes:
      label: Número do ADR (sequencial)
      placeholder: "0007"
    validations:
      required: true

  - type: input
    id: adr-title
    attributes:
      label: Título
      placeholder: "<título curto da decisão>"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Qual problema observado motiva esta decisão?
      placeholder: "<evidências, restrições e decisão a tomar>"
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decisão
      description: A mudança que estamos propondo ou que concordamos em fazer.
      placeholder: "<decisão tomada explicitamente pela equipe>"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      placeholder: |
        - <alternativa A> — <compensação>
        - <alternativa B> — <compensação>
    validations:
      required: true

  - type: textarea
    id: consequences
    attributes:
      label: Consequências
      description: O que fica mais fácil? O que fica mais difícil? Há algum risco?
      placeholder: |
        Mais fácil: <efeito>
        Mais difícil: <efeito>
        Mitigação: <ação>
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Situação
      options:
        - proposto
        - aceito
        - descontinuado
        - substituído
    validations:
      required: true

  - type: input
    id: supersedes
    attributes:
      label: Substitui (número do ADR, se houver)
      placeholder: "Não se aplica"

  - type: dropdown
    id: lead-persona
    attributes:
      label: Persona autora
      options:
        - Arquiteto Corporativo
        - Arquiteto de Software
        - Líder Técnico
    validations:
      required: true
